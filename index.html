<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashraful Joy | Official Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@300;400;600&display=swap');

        :root {
            --bg: #0b1120;
            --card: #111827;
            --text: #f3f4f6;
            --dim: #9ca3af;
            --accent: #38bdf8;
        }

        [data-theme="light"] {
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --dim: #6b7280;
            --accent: #2563eb;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            transition: 0.3s ease;
            scroll-behavior: smooth;
        }

        /* Header */
        header {
            position: fixed;
            top: 0; width: 100%;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(var(--bg), 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-sizing: border-box;
        }

        .logo { font-family: 'Montserrat', sans-serif; font-weight: 900; color: var(--accent); }

        .nav-controls { display: flex; gap: 15px; align-items: center; }

        .control-btn {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Hero Section */
        .hero { text-align: center; padding: 120px 20px 40px; }
        
        .profile-img {
            width: 130px; height: 130px;
            border-radius: 35px;
            object-fit: cover;
            border: 4px solid var(--accent);
            transform: rotate(-6deg);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: rotate(-6deg) translateY(0); }
            50% { transform: rotate(-2deg) translateY(-10px); }
        }

        .name {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem; font-weight: 900;
            margin: 15px 0;
            text-transform: uppercase;
        }

        /* Typing Animation */
        .role-box { font-size: 1.1rem; font-weight: 600; margin-bottom: 30px; }
        .static-txt { color: var(--text); }
        .dynamic-txt { border-right: 2px solid; padding-left: 5px; }

        /* About Section (Image 6865.jpg Style) */
        .about-section {
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }

        .about-header { text-align: center; margin-bottom: 30px; }
        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
        }

        .about-title { font-family: 'Montserrat', sans-serif; font-size: 2rem; margin: 10px 0; }

        .info-table { width: 100%; border-collapse: collapse; }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid rgba(156, 163, 175, 0.2);
            font-size: 0.95rem;
        }

        .info-label { color: var(--dim); display: flex; align-items: center; gap: 10px; font-weight: 600; }
        .info-value { color: var(--text); font-weight: 500; text-align: right; }
        .map-link { color: var(--accent); text-decoration: none; font-weight: 700; }

        /* Side Nav */
        .side-nav {
            position: fixed; top: 0; right: -100%;
            width: 260px; height: 100%;
            background: var(--card);
            z-index: 2000; transition: 0.4s;
            display: flex; flex-direction: column; padding: 50px 0;
        }
        .side-nav.active { right: 0; }
        .nav-links a {
            padding: 15px 40px; text-decoration: none; color: var(--dim); font-weight: 600;
        }
        .nav-links a:hover { color: var(--accent); background: rgba(56, 189, 248, 0.1); }

    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-theme="dark">

    <header>
        <div class="logo">ASHRAFUL JOY</div>
        <div class="nav-controls">
            <button class="control-btn" id="theme-toggle"><i class="fas fa-moon"></i></button>
            <button class="control-btn" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
        </div>
    </header>

    <nav class="side-nav" id="sideNav">
        <div style="text-align: right; padding: 20px;"><i class="fas fa-times" onclick="toggleMenu()" style="cursor:pointer; font-size: 1.5rem;"></i></div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#about">About Me</a>
            <a href="#">Services</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <div class="hero">
        <img src="https://raw.githubusercontent.com/ashrafuljoy62/index.html/WiFu/IMG-20251227-WA0018.jpg" alt="Joy" class="profile-img">
        <div class="name">Ashraful Alam Joy</div>
        <div class="role-box">
            <span class="static-txt">I Am A </span>
            <span class="dynamic-txt" id="type-text"></span>
        </div>
    </div>

    <!-- About Section (Image 6865.jpg Style) -->
    <section class="about-section" id="about">
        <div class="about-header">
            <span class="badge"><i class="fas fa-user"></i> About Me</span>
            <h2 class="about-title">Know Me Better</h2>
            <div style="width: 50px; height: 4px; background: var(--accent); margin: 0 auto; border-radius: 2px;"></div>
        </div>

        <div class="info-table">
            <div class="info-row">
                <span class="info-label"><i class="fas fa-id-card"></i> FULL NAME</span>
                <span class="info-value">Ashraful Alam Joy</span>
            </div>
            <div class="info-row">
                <span class="info-label"><i class="fas fa-birthday-cake"></i> AGE</span>
                <span class="info-value">23 Years Old</span>
            </div>
            <div class="info-row">
                <span class="info-label"><i class="fas fa-moon"></i> RELIGION</span>
                <span class="info-value">Islam</span>
            </div>
            <div class="info-row">
                <span class="info-label"><i class="fas fa-briefcase"></i> OCCUPATION</span>
                <span class="info-value">Government Employee</span>
            </div>
            <div class="info-row">
                <span class="info-label"><i class="fas fa-map-marker-alt"></i> LOCATION</span>
                <span class="info-value">Dinajpur, BD <a href="https://www.google.com/maps/search/Dinajpur,Bangladesh" class="map-link" target="_blank">Visit on Map <i class="fas fa-external-link-alt" style="font-size: 0.7rem;"></i></a></span>
            </div>
        </div>
    </section>

    <script>
        // Typing Animation
        const roles = [
            { text: "Firefighter", color: "#f87171" },
            { text: "Developer", color: "#60a5fa" },
            { text: "Web Designer", color: "#34d399" },
            { text: "Creative Editor", color: "#fbbf24" }
        ];

        let rIdx = 0, cIdx = 0, isDel = false;
        const target = document.getElementById("type-text");

        function type() {
            const current = roles[rIdx];
            target.style.color = current.color;
            
            target.textContent = isDel ? current.text.substring(0, cIdx - 1) : current.text.substring(0, cIdx + 1);
            cIdx = isDel ? cIdx - 1 : cIdx + 1;

            let speed = isDel ? 60 : 120;
            if(!isDel && cIdx === current.text.length) { speed = 2000; isDel = true; }
            else if(isDel && cIdx === 0) { isDel = false; rIdx = (rIdx + 1) % roles.length; speed = 500; }

            setTimeout(type, speed);
        }

        // Theme Toggle
        const themeBtn = document.getElementById('theme-toggle');
        themeBtn.onclick = () => {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            themeBtn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        };

        function toggleMenu() { document.getElementById('sideNav').classList.toggle('active'); }

        document.addEventListener("DOMContentLoaded", type);
    </script>
</body>
</html>
