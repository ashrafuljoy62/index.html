<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashraful Joy | Premium Bio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Poppins:wght@400;600&display=swap');

        :root {
            --bg: #f3f4f6;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text: #1f2937;
        }

        [data-theme="dark"] {
            --bg: #0b0f1a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f3f4f6;
        }

        body { 
            background-color: var(--bg); 
            color: var(--text);
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
            transition: 0.5s ease;
        }

        .container { 
            width: 90%; 
            max-width: 400px; 
            text-align: center; 
            margin-top: 80px;
        }

        /* ছবি বাকা এবং দুলবে */
        .profile-img { 
            width: 135px; height: 135px; 
            border-radius: 35px; 
            object-fit: cover; 
            border: 4px solid white; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.1); 
            transform: rotate(-6deg);
            animation: slowFloat 4s ease-in-out infinite;
        }

        @keyframes slowFloat {
            0%, 100% { transform: rotate(-6deg) translateY(0); }
            50% { transform: rotate(-2deg) translateY(-10px); }
        }

        /* নরমালের মধ্যে গর্জিয়াস নাম */
        .gorgeous-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin: 15px 0 5px;
            background: linear-gradient(to right, #1e3a8a, #3b82f6, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* "I am" স্থির, বাকিটা অ্যানিমেটেড */
        .role-container {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 35px;
            color: #6b7280;
        }

        .static-iam { color: var(--text); opacity: 0.8; }

        .dynamic-role {
            color: #ef4444; /* ডিফল্ট কালার */
            border-right: 2px solid;
            padding-left: 5px;
        }

        .link-card { 
            display: flex; 
            align-items: center; 
            background: var(--card-bg); 
            color: var(--text); 
            padding: 16px 20px; 
            margin-bottom: 12px; 
            border-radius: 18px; 
            text-decoration: none; 
            font-weight: 700; 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        .link-card:hover { transform: translateY(-3px) scale(1.02); background: white; }

        .link-card i { font-size: 22px; margin-right: 15px; width: 30px; text-align: center; }

        /* Icons & Nav */
        .nav-btns { position: fixed; top: 20px; width: 90%; max-width: 400px; display: flex; justify-content: space-between; }
        .btn-icon { background: var(--card-bg); border: none; width: 40px; height: 40px; border-radius: 10px; color: var(--text); cursor: pointer; }

    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="nav-btns">
        <button class="btn-icon" id="theme-btn"><i class="fas fa-adjust"></i></button>
        <button class="btn-icon" onclick="document.getElementById('menu').classList.toggle('active')"><i class="fas fa-bars"></i></button>
    </div>

    <div class="container">
        <img src="https://raw.githubusercontent.com/ashrafuljoy62/index.html/WiFu/IMG-20251227-WA0018.jpg" alt="Joy" class="profile-img">
        
        <div class="gorgeous-name">Ashraful Joy</div>
        
        <div class="role-container">
            <span class="static-iam">I am </span>
            <span class="dynamic-role" id="role-text"></span>
        </div>

        <div class="links-list">
            <a href="https://m.facebook.com/ashrafulalam05" class="link-card"><i class="fab fa-facebook" style="color: #1877f2;"></i> Facebook</a>
            <a href="https://www.instagram.com/firefighter.joy" class="link-card"><i class="fab fa-instagram" style="color: #e4405f;"></i> Instagram</a>
            <a href="https://t.me/premium_master_62" class="link-card"><i class="fab fa-telegram" style="color: #0088cc;"></i> Telegram</a>
            <a href="https://t.me/movieallpremium" class="link-card"><i class="fas fa-video" style="color: #229ED9;"></i> Movie Channel</a>
            <a href="https://www.tiktok.com/@fire.fighter.joy" class="link-card"><i class="fab fa-tiktok"></i> TikTok</a>
            <a href="https://youtube.com/@ashraful_creation" class="link-card"><i class="fab fa-youtube" style="color: #ff0000;"></i> YouTube</a>
        </div>
    </div>

    <script>
        // পদবী অ্যানিমেশন
        const roles = [
            { text: "Firefighter", color: "#f87171" },
            { text: "Web Designer", color: "#60a5fa" },
            { text: "Developer", color: "#34d399" },
            { text: "Creative Editor", color: "#fbbf24" }
        ];

        let roleIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const roleSpan = document.getElementById("role-text");

        function type() {
            const currentRole = roles[roleIndex];
            roleSpan.style.color = currentRole.color;

            if (isDeleting) {
                roleSpan.textContent = currentRole.text.substring(0, charIndex - 1);
                charIndex--;
            } else {
                roleSpan.textContent = currentRole.text.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? 50 : 150;

            if (!isDeleting && charIndex === currentRole.text.length) {
                typeSpeed = 2000; // শেষে ২ সেকেন্ড থামবে
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                roleIndex = (roleIndex + 1) % roles.length;
                typeSpeed = 500;
            }

            setTimeout(type, typeSpeed);
        }

        document.addEventListener("DOMContentLoaded", type);

        // ডার্ক মোড
        const themeBtn = document.getElementById('theme-btn');
        themeBtn.onclick = () => {
            const current = document.body.getAttribute('data-theme');
            document.body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
            localStorage.setItem('theme', current === 'dark' ? 'light' : 'dark');
        };
        if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
    </script>
</body>
</html>
