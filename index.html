<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashraful Joy | Premium Portfolio</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text: #0f172a;
            --accent: #3b82f6;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg: #020617;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f1f5f9;
            --accent: #60a5fa;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Animated Background Glow */
        body::before {
            content: "";
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, var(--accent) 0%, transparent 20%);
            opacity: 0.05;
            z-index: -1;
            animation: move 10s infinite linear;
        }

        @keyframes move { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .nav {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            position: sticky;
            top: 0;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .btn-icon {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            width: 45px; height: 45px;
            border-radius: 12px;
            cursor: pointer;
            display: grid; place-items: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px var(--shadow);
            transition: 0.3s;
        }

        .btn-icon:active { transform: scale(0.9); }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            max-width: 450px;
            margin: 0 auto;
            width: 90%;
        }

        .profile-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-img {
            width: 130px; height: 130px;
            border-radius: 40px; /* Squircle shape */
            object-fit: cover;
            border: 4px solid var(--card-bg);
            box-shadow: 0 20px 40px var(--shadow);
            transform: rotate(-3deg);
            transition: 0.5s;
        }

        .profile-img:hover { transform: rotate(0deg) scale(1.05); }

        h1 { font-size: 1.8rem; margin: 15px 0 5px; font-weight: 800; }
        .tagline { opacity: 0.7; font-size: 0.9rem; margin-bottom: 20px; letter-spacing: 1px; }

        .links-grid { width: 100%; display: grid; gap: 15px; }

        .link-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 16px 20px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 4px 15px var(--shadow);
        }

        .link-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 10px 25px var(--shadow);
        }

        .link-card i {
            font-size: 1.5rem;
            margin-right: 15px;
            width: 30px;
            text-align: center;
        }

        /* Menu Sidebar */
        #menu-drawer {
            position: fixed;
            bottom: -100%; left: 0; width: 100%;
            background: var(--container-bg);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 30px 30px 0 0;
            padding: 40px 20px;
            transition: 0.5s;
            z-index: 200;
            text-align: center;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
        }

        #menu-drawer.active { bottom: 0; }

        .close-menu { margin-top: 20px; color: var(--accent); cursor: pointer; font-weight: bold; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav class="nav">
        <button class="btn-icon" id="theme-btn"><i class="fas fa-moon"></i></button>
        <button class="btn-icon" id="menu-btn"><i class="fas fa-ellipsis-h"></i></button>
    </nav>

    <div class="container">
        <div class="profile-section">
            <img src="https://raw.githubusercontent.com/ashrafuljoy62/index.html/WiFu/IMG-20251227-WA0018.jpg" alt="Joy" class="profile-img">
            <h1>Ashraful Joy</h1>
            <p class="tagline">DEVELOPER & CREATIVE EDITOR</p>
        </div>

        <div class="links-grid">
            <a href="https://m.facebook.com/ashrafulalam05" class="link-card" target="_blank">
                <i class="fab fa-facebook" style="color: #1877f2;"></i> Facebook
            </a>
            <a href="https://www.instagram.com/firefighter.joy" class="link-card" target="_blank">
                <i class="fab fa-instagram" style="color: #e4405f;"></i> Instagram
            </a>
            <a href="https://t.me/premium_master_62" class="link-card" target="_blank">
                <i class="fab fa-telegram" style="color: #0088cc;"></i> Telegram
            </a>
            <a href="https://t.me/movieallpremium" class="link-card" target="_blank">
                <i class="fas fa-layer-group" style="color: #229ED9;"></i> Movie Channel
            </a>
            <a href="https://www.tiktok.com/@fire.fighter.joy" class="link-card" target="_blank">
                <i class="fab fa-tiktok"></i> TikTok
            </a>
            <a href="https://youtube.com/@ashraful_creation" class="link-card" target="_blank">
                <i class="fab fa-youtube" style="color: #ff0000;"></i> YouTube
            </a>
        </div>
    </div>

    <div id="menu-drawer">
        <h3>Quick Menu</h3>
        <p>Email: contact@ashrafuljoy.pro.bd</p>
        <p>Location: Dinajpur, Bangladesh</p>
        <div class="close-menu" id="close-btn">Close</div>
    </div>

    <script>
        // Theme Toggle
        const themeBtn = document.getElementById('theme-btn');
        const body = document.body;
        
        themeBtn.onclick = () => {
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            themeBtn.innerHTML = isDark ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        };

        if(localStorage.getItem('theme') === 'dark') {
            body.setAttribute('data-theme', 'dark');
            themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
        }

        // Menu Toggle
        const menuBtn = document.getElementById('menu-btn');
        const drawer = document.getElementById('menu-drawer');
        const closeBtn = document.getElementById('close-btn');

        menuBtn.onclick = () => drawer.classList.add('active');
        closeBtn.onclick = () => drawer.classList.remove('active');
    </script>
</body>
</html>
