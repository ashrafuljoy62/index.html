<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashraful Joy | Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@300;400;600&display=swap');

        :root {
            --bg: #0b1120;
            --card: #111827;
            --text: #f3f4f6;
            --dim: #9ca3af;
            --accent: #38bdf8;
        }

        [data-theme="light"] {
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --dim: #6b7280;
            --accent: #2563eb;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            transition: 0.3s ease;
            scroll-behavior: smooth;
        }

        /* Header & Nav Controls */
        header {
            position: fixed;
            top: 0; width: 100%;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(var(--bg), 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-sizing: border-box;
        }

        .nav-controls { display: flex; gap: 10px; }
        .control-btn {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            width: 42px; height: 42px;
            border-radius: 12px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Side Navigation Styling */
        .side-nav {
            position: fixed; top: 0; right: -100%;
            width: 280px; height: 100%;
            background: var(--card);
            z-index: 2000; 
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        .side-nav.active { right: 0; }

        .nav-links {
            margin-top: 80px;
            display: flex;
            flex-direction: column;
        }
        .nav-links a {
            padding: 18px 35px;
            text-decoration: none;
            color: var(--dim);
            font-weight: 600;
            font-size: 1.1rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .nav-links a:hover {
            color: var(--accent);
            background: rgba(56, 189, 248, 0.08);
            padding-left: 45px;
        }

        /* Profile Image Styles with Floating Animation */
        .profile-img-container {
            text-align: center;
            padding: 120px 20px 20px;
        }
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%; /* একদম গোল করার জন্য */
            border: 4px solid var(--accent);
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.2);
            animation: floatAnimation 3s ease-in-out infinite; /* সবসময় নড়াচড়া করার জন্য */
        }

        @keyframes floatAnimation {
            0% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-10px) rotate(3deg); /* হালকা উপরে উঠবে এবং একটু ঘুরবে */
            }
            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }

        /* Info Sections Styling */
        .section-container { max-width: 600px; margin: 40px auto; padding: 20px; }
        
        .info-table { 
            background: var(--card); 
            border-radius: 20px; 
            padding: 10px 25px; 
            border: 1px solid rgba(255,255,255,0.05);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 18px 0;
            border-bottom: 1px solid rgba(156, 163, 175, 0.1);
        }
        .info-row:last-child { border-bottom: none; }
        .label { color: var(--dim); font-weight: 600; font-size: 0.9rem; text-transform: uppercase; }
        .val { font-weight: 500; }

        /* Social Icons */
        .social-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px;
        }
        .social-box {
            background: var(--bg); padding: 15px; border-radius: 15px;
            text-align: center; color: var(--text); text-decoration: none;
            transition: 0.3s; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.05);
        }
        .social-box:hover { background: var(--accent); color: white; transform: translateY(-5px); }

        /* Form Styling */
        .contact-form input, .contact-form textarea {
            width: 100%; background: var(--bg); border: 1px solid rgba(156,163,175,0.2);
            padding: 15px; border-radius: 12px; color: var(--text);
            margin-bottom: 15px; outline: none; box-sizing: border-box;
        }
        .send-btn {
            background: var(--accent); color: white; border: none;
            padding: 15px; border-radius: 12px; width: 100%;
            font-weight: 700; cursor: pointer; transition: 0.3s;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-theme="dark">

    <header>
        <div style="font-family: 'Montserrat'; font-weight: 900; color: var(--accent);">ASHRAFUL JOY</div>
        <div class="nav-controls">
            <button class="control-btn" id="theme-toggle"><i class="fas fa-moon"></i></button>
            <button class="control-btn" onclick="toggleMenu()"><i class="fas fa-bars-staggered"></i></button>
        </div>
    </header>

    <!-- Side Navigation -->
    <nav class="side-nav" id="sideNav">
        <div style="text-align: right; padding: 20px;"><i class="fas fa-times" onclick="toggleMenu()" style="cursor:pointer; color: var(--dim); font-size: 1.5rem;"></i></div>
        <div class="nav-links">
            <a href="#" onclick="toggleMenu()"><i class="fas fa-home"></i> Home</a>
            <a href="#about-me" onclick="toggleMenu()"><i class="fas fa-user-circle"></i> About Me</a>
            <a href="#contact" onclick="toggleMenu()"><i class="fas fa-paper-plane"></i> Contact</a>
            <a href="https://github.com/ashrafuljoy62" onclick="toggleMenu()"><i class="fas fa-folder-open"></i> Projects</a>
        </div>
    </nav>

    <!-- Hero Section with Animated Profile Pic -->
    <div class="profile-img-container">
        <img src="https://raw.githubusercontent.com/ashrafuljoy62/index.html/WiFu/IMG-20251227-WA0018.jpg" class="profile-img" alt="Joy">
        <h1 style="font-family:'Montserrat'; margin: 20px 0 5px;">Ashraful Alam Joy</h1>
        <p style="color:var(--dim);">Government Employee | Developer</p>
    </div>

    <!-- About Me Section -->
    <section id="about-me" class="section-container">
        <h3 style="text-align: center; font-family: 'Montserrat';"><i class="fas fa-user-tie"></i> Profile Details</h3>
        <div class="info-table">
            <div class="info-row"><span class="label">Name</span><span class="val">Ashraful Alam Joy</span></div>
            <div class="info-row"><span class="label">Age</span><span class="val">23 Years</span></div>
            <div class="info-row"><span class="label">Religion</span><span class="val">Islam</span></div>
            <div class="info-row"><span class="label">Occupation</span><span class="val">Government Employee</span></div>
            <div class="info-row"><span class="label">Location</span><span class="val"><a href="https://www.google.com/maps/search/Dinajpur,Bangladesh" style="color:var(--accent); text-decoration:none;">Dinajpur, BD <i class="fas fa-map-marker-alt"></i></a></span></div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="section-container">
        <h3 style="text-align: center; font-family: 'Montserrat';"><i class="fas fa-comments"></i> Get In Touch</h3>
        <div class="social-grid">
            <a href="https://m.facebook.com/ashrafulalam05" class="social-box"><i class="fab fa-facebook"></i><br>Facebook</a>
            <a href="https://t.me/premium_master_62" class="social-box"><i class="fab fa-telegram"></i><br>Telegram</a>
            <a href="mailto:ashrafulalamjoy003@gmail.com" class="social-box"><i class="fas fa-envelope"></i><br>Email</a>
        </div>
        
        <div style="margin-top: 30px; background: var(--card); padding: 25px; border-radius: 20px;">
            <form action="https://formspree.io/f/YOUR_ID" method="POST" class="contact-form">
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="email" name="email" placeholder="Email Address" required>
                <textarea name="message" rows="4" placeholder="Your Message..." required></textarea>
                <button type="submit" class="send-btn">Send Message <i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </section>

    <script>
        function toggleMenu() { document.getElementById('sideNav').classList.toggle('active'); }
        
        document.getElementById('theme-toggle').onclick = function() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            this.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        };
    </script>
</body>
</html>
