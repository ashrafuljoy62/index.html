<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashraful Joy | Links</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --container-bg: #ffffff;
            --text-color: #1f2937;
            --btn-bg: #ffffff;
            --btn-border: #e5e7eb;
            --btn-text: #374151;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-color: #f3f4f6;
            --btn-bg: #334155;
            --btn-border: #475569;
            --btn-text: #f3f4f6;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            transition: all 0.3s ease;
        }

        /* Header Buttons */
        .header-controls {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .icon-btn {
            background: var(--container-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-color);
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .container { 
            width: 90%; 
            max-width: 400px; 
            background: var(--container-bg); 
            padding: 30px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            text-align: center; 
            margin: 10px auto 40px;
        }

        .profile-img { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 4px solid var(--container-bg); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            margin-bottom: 15px; 
        }

        h1 { font-size: 24px; margin: 10px 0 5px; }
        p { color: #888; font-size: 14px; margin-bottom: 25px; }

        .links-list { width: 100%; }
        .social-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: var(--btn-bg); 
            color: var(--btn-text); 
            padding: 14px; 
            margin-bottom: 12px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: 600; 
            border: 1px solid var(--btn-border); 
            transition: transform 0.2s;
        }
        .social-btn:hover { transform: scale(1.02); }
        .social-btn i { font-size: 20px; margin-right: 12px; width: 25px; text-align: center; }

        /* Simple Menu Alert */
        .menu-hidden { display: none; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-controls">
        <!-- Dark Mode Button -->
        <button class="icon-btn" id="theme-toggle">
            <i class="fas fa-moon"></i>
        </button>
        
        <!-- Menu Button -->
        <button class="icon-btn" onclick="alert('Menu clicked! You can add links here.')">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <div class="container">
        <img src="https://raw.githubusercontent.com/ashrafuljoy62/index.html/WiFu/IMG-20251227-WA0018.jpg" alt="Ashraful Joy" class="profile-img">
        <h1>Ashraful Joy</h1>
        <p>Follow Me on Social Media</p>
        
        <div class="links-list">
            <a href="https://m.facebook.com/ashrafulalam05" class="social-btn" target="_blank"><i class="fab fa-facebook" style="color: #1877f2;"></i> Facebook</a>
            <a href="https://www.instagram.com/firefighter.joy" class="social-btn" target="_blank"><i class="fab fa-instagram" style="color: #e4405f;"></i> Instagram</a>
            <a href="https://t.me/premium_master_62" class="social-btn" target="_blank"><i class="fab fa-telegram" style="color: #0088cc;"></i> Telegram</a>
            <a href="https://t.me/movieallpremium" class="social-btn" target="_blank"><i class="fas fa-bullhorn" style="color: #229ED9;"></i> TG Channel</a>
            <a href="https://www.tiktok.com/@fire.fighter.joy" class="social-btn" target="_blank"><i class="fab fa-tiktok" style="color: #000000;"></i> TikTok</a>
            <a href="https://youtube.com/@ashraful_creation" class="social-btn" target="_blank"><i class="fab fa-youtube" style="color: #ff0000;"></i> YouTube</a>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');

        // Check for saved theme
        if (localStorage.getItem('theme') === 'dark') {
            body.setAttribute('data-theme', 'dark');
            icon.classList.replace('fa-moon', 'fa-sun');
        }

        themeToggle.addEventListener('click', () => {
            if (body.hasAttribute('data-theme')) {
                body.removeAttribute('data-theme');
                icon.classList.replace('fa-sun', 'fa-moon');
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                icon.classList.replace('fa-moon', 'fa-sun');
                localStorage.setItem('theme', 'dark');
            }
        });
    </script>
</body>
</html>
