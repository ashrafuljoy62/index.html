<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashraful Joy | Premium Bio</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text: #1a1a1a;
            --accent: #ff0055;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg: #050505;
            --card-bg: rgba(25), 25, 25, 0.8);
            --text: #ffffff;
            --shadow: rgba(0, 0, 0, 0.6);
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: 0.5s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav {
            width: 90%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            padding: 20px 0;
        }

        .btn-icon {
            background: var(--card-bg);
            border: none;
            color: var(--text);
            width: 45px; height: 45px;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--shadow);
            font-size: 1.2rem;
        }

        .profile-card {
            text-align: center;
            width: 90%;
            max-width: 450px;
            margin-top: 20px;
        }

        .profile-img {
            width: 140px; height: 140px;
            border-radius: 45px;
            object-fit: cover;
            border: 5px solid var(--card-bg);
            box-shadow: 0 25px 50px var(--shadow);
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* অতি মোটা এবং কালারফুল নাম */
        .ultra-bold-name {
            font-size: 2.8rem;
            font-weight: 900;
            margin: 20px 0 10px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ff0055, #00dbde, #fc00ff, #00dbde);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* পদবী অ্যানিমেশন */
        .role-container {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 30px;
            display: block;
        }

        .static-roles { color: var(--accent); }
        
        .typing-text {
            color: #4a90e2;
            border-right: 2px solid;
            padding-right: 5px;
            animation: cursor 0.8s infinite;
        }

        @keyframes cursor { 50% { border-color: transparent; } }

        /* প্রিমিয়াম লিঙ্ক বাটন */
        .links-list { width: 100%; display: grid; gap: 15px; }

        .link-item {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            padding: 18px 25px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text);
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px var(--shadow);
        }

        .link-item:hover {
            transform: scale(1.05) translateY(-5px);
            background: var(--accent);
            color: white;
        }

        .link-item i { font-size: 1.6rem; margin-right: 15px; }

        /* মেনু ড্রয়ার */
        #menu-drawer {
            position: fixed;
            bottom: -100%; left: 0; width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            border-radius: 40px 40px 0 0;
            padding: 50px 20px;
            transition: 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 200;
            text-align: center;
        }

        #menu-drawer.active { bottom: 0; }
        .close-btn { color: #ff0055; cursor: pointer; margin-top: 30px; font-weight: 800; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="nav">
        <button class="btn-icon" id="theme-btn"><i class="fas fa-adjust"></i></button>
        <button class="btn-icon" id="menu-btn"><i class="fas fa-th-large"></i></button>
    </nav>

    <div class="profile-card">
        <img src="https://raw.githubusercontent.com/ashrafuljoy62/index.html/WiFu/IMG-20251227-WA0018.jpg" alt="Ashraful Joy" class="profile-img">
        
        <div class="ultra-bold-name">Ashraful Joy</div>
        
        <div class="role-container">
            <span class="static-roles">I am a </span>
            <span class="typing-text" id="typewriter"></span>
        </div>

        <div class="links-list">
            <a href="https://m.facebook.com/ashrafulalam05" class="link-item"><i class="fab fa-facebook"></i> Facebook</a>
            <a href="https://www.instagram.com/firefighter.joy" class="link-item"><i class="fab fa-instagram"></i> Instagram</a>
            <a href="https://t.me/premium_master_62" class="link-item"><i class="fab fa-telegram"></i> Telegram</a>
            <a href="https://t.me/movieallpremium" class="link-item"><i class="fas fa-play-circle"></i> Movies</a>
            <a href="https://www.tiktok.com/@fire.fighter.joy" class="link-item"><i class="fab fa-tiktok"></i> TikTok</a>
            <a href="https://youtube.com/@ashraful_creation" class="link-item"><i class="fab fa-youtube"></i> YouTube</a>
        </div>
    </div>

    <div id="menu-drawer">
        <h2 style="margin-bottom: 20px;">Get In Touch</h2>
        <p style="font-size: 1.1rem;"><i class="fas fa-envelope"></i> ashrafulalamjoy003@gmail.com</p>
        <p style="font-size: 1.1rem;"><i class="fas fa-map-marker-alt"></i> Dinajpur, Bangladesh</p>
        <div class="close-btn" id="close-btn">DISMISS</div>
    </div>

    <script>
        // Typing Animation
        const txtElement = document.getElementById('typewriter');
        const words = ["Firefighter", "Web Designer", "Developer", "Creative Editor"];
        let wait = 2000;
        let isDeleting = false;
        let txt = '';
        let wordIndex = 0;

        function type() {
            const current = wordIndex % words.length;
            const fullTxt = words[current];

            if(isDeleting) {
                txt = fullTxt.substring(0, txt.length - 1);
            } else {
                txt = fullTxt.substring(0, txt.length + 1);
            }

            txtElement.innerHTML = txt;

            let typeSpeed = 100;
            if(isDeleting) typeSpeed /= 2;

            if(!isDeleting && txt === fullTxt) {
                typeSpeed = wait;
                isDeleting = true;
            } else if(isDeleting && txt === '') {
                isDeleting = false;
                wordIndex++;
                typeSpeed = 500;
            }

            setTimeout(() => type(), typeSpeed);
        }

        document.addEventListener('DOMContentLoaded', type);

        // Theme Toggle
        const themeBtn = document.getElementById('theme-btn');
        themeBtn.onclick = () => {
            const current = document.body.getAttribute('data-theme');
            document.body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
            localStorage.setItem('theme', current === 'dark' ? 'light' : 'dark');
        };

        if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');

        // Drawer
        const drawer = document.getElementById('menu-drawer');
        document.getElementById('menu-btn').onclick = () => drawer.classList.add('active');
        document.getElementById('close-btn').onclick = () => drawer.classList.remove('active');
    </script>
</body>
</html>
