<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashraful Joy | Professional Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@300;400;600&display=swap');

        :root {
            --bg: #0b1120;
            --card: #111827;
            --text: #f3f4f6;
            --dim: #9ca3af;
            --accent: #38bdf8;
        }

        [data-theme="light"] {
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --dim: #6b7280;
            --accent: #2563eb;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            transition: 0.3s ease;
            scroll-behavior: smooth;
        }

        header {
            position: fixed;
            top: 0; width: 100%;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(var(--bg), 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-sizing: border-box;
        }

        .nav-controls { display: flex; gap: 10px; }
        .control-btn {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            width: 40px; height: 40px;
            border-radius: 12px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Side Nav - Fixed as per 6866.jpg feedback */
        .side-nav {
            position: fixed; top: 0; right: -100%;
            width: 280px; height: 100%;
            background: var(--card);
            z-index: 2000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        .side-nav.active { right: 0; }

        .nav-links {
            margin-top: 80px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .nav-links a {
            padding: 15px 30px;
            text-decoration: none;
            color: var(--dim);
            font-weight: 600;
            font-size: 1.1rem;
            transition: 0.3s;
            border-left: 4px solid transparent;
        }
        .nav-links a:hover {
            color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
            border-left: 4px solid var(--accent);
        }

        .hero { text-align: center; padding: 120px 20px 40px; }
        .profile-img {
            width: 130px; height: 130px; border-radius: 35px;
            object-fit: cover; border: 4px solid var(--accent);
            transform: rotate(-6deg); animation: float 4s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: rotate(-6deg) translateY(0); } 50% { transform: rotate(-2deg) translateY(-10px); } }

        /* Contact Section */
        .contact-section { max-width: 600px; margin: 60px auto; padding: 20px; }
        .contact-card {
            background: var(--card);
            padding: 30px; border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .social-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px;
        }
        .social-item {
            background: var(--bg); padding: 12px; border-radius: 12px;
            text-align: center; color: var(--text); text-decoration: none;
            font-size: 0.8rem; font-weight: 600; transition: 0.3s;
        }
        .social-item:hover { background: var(--accent); color: white; transform: translateY(-3px); }

        /* Form Styling */
        .contact-form input, .contact-form textarea {
            width: 100%; background: var(--bg); border: 1px solid rgba(156,163,175,0.2);
            padding: 15px; border-radius: 12px; color: var(--text);
            margin-bottom: 15px; outline: none; box-sizing: border-box;
            font-family: inherit;
        }
        .send-btn {
            background: var(--accent); color: white; border: none;
            padding: 15px; border-radius: 12px; width: 100%;
            font-weight: 700; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .send-btn:hover { opacity: 0.9; transform: scale(0.98); }

        footer { text-align: center; padding: 40px; color: var(--dim); font-size: 0.8rem; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-theme="dark">

    <header>
        <div style="font-family: 'Montserrat'; font-weight: 900; color: var(--accent);">ASHRAFUL JOY</div>
        <div class="nav-controls">
            <button class="control-btn" id="theme-toggle"><i class="fas fa-moon"></i></button>
            <button class="control-btn" onclick="toggleMenu()"><i class="fas fa-bars-staggered"></i></button>
        </div>
    </header>

    <nav class="side-nav" id="sideNav">
        <div style="text-align: right; padding: 20px;"><i class="fas fa-times" onclick="toggleMenu()" style="cursor:pointer; color: var(--dim);"></i></div>
        <div class="nav-links">
            <a href="#"><i class="fas fa-home"></i> Home</a>
            <a href="#about"><i class="fas fa-user"></i> About Me</a>
            <a href="#"><i class="fas fa-code"></i> Services</a>
            <a href="#"><i class="fas fa-tasks"></i> Projects</a>
            <a href="#contact"><i class="fas fa-envelope"></i> Contact</a>
        </div>
    </nav>

    <div class="hero">
        <img src="https://raw.githubusercontent.com/ashrafuljoy62/index.html/WiFu/IMG-20251227-WA0018.jpg" alt="Joy" class="profile-img">
        <h1 style="font-family: 'Montserrat'; font-weight: 900; font-size: 2rem; margin: 20px 0;">Ashraful Alam Joy</h1>
        <p style="color: var(--accent); font-weight: 600;">I Am A <span id="typing"></span></p>
    </div>

    <!-- Contact Section -->
    <section class="contact-section" id="contact">
        <div style="text-align: center; margin-bottom: 30px;">
            <h2 style="font-family: 'Montserrat'; font-size: 1.8rem; margin: 0;">Connect With Me</h2>
            <p style="color: var(--dim);">Let's build something amazing together!</p>
        </div>

        <div class="contact-card">
            <!-- Social Links -->
            <div class="social-grid">
                <a href="https://m.facebook.com/ashrafulalam05" class="social-item"><i class="fab fa-facebook"></i><br>FB</a>
                <a href="https://t.me/premium_master_62" class="social-item"><i class="fab fa-telegram"></i><br>TG</a>
                <a href="https://www.instagram.com/firefighter.joy" class="social-item"><i class="fab fa-instagram"></i><br>IG</a>
                <a href="https://github.com/ashrafuljoy62" class="social-item"><i class="fab fa-github"></i><br>GH</a>
                <a href="https://youtube.com/@ashraful_creation" class="social-item"><i class="fab fa-youtube"></i><br>YT</a>
                <a href="mailto:ashrafulalamjoy003@gmail.com" class="social-item"><i class="fas fa-envelope"></i><br>Mail</a>
            </div>

            <!-- Contact Form -->
            <!-- Note: Replace 'YOUR_FORM_ID' with your Formspree ID to receive emails -->
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="contact-form">
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="email" name="email" placeholder="Your Email Address" required>
                <input type="text" name="subject" placeholder="Subject">
                <textarea name="message" rows="5" placeholder="Write your details here..." required></textarea>
                <button type="submit" class="send-btn">Send Message <i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </section>

    <footer>
        <p>Built with ❤️ by Ashraful Joy</p>
        <p>&copy; 2026 All Rights Reserved.</p>
    </footer>

    <script>
        // Typing Animation
        const roles = [
            { text: "Firefighter", color: "#f87171" },
            { text: "Developer", color: "#60a5fa" },
            { text: "Web Designer", color: "#34d399" }
        ];
        let rI = 0, cI = 0, isD = false;
        const el = document.getElementById("typing");

        function type() {
            const current = roles[rI];
            el.style.color = current.color;
            el.textContent = current.text.substring(0, cI + (isD ? -1 : 1));
            cI += isD ? -1 : 1;
            let s = isD ? 60 : 150;
            if(!isD && cI === current.text.length) { s = 2000; isD = true; }
            else if(isD && cI === 0) { isD = false; rI = (rI + 1) % roles.length; s = 500; }
            setTimeout(type, s);
        }

        // Theme Toggle
        document.getElementById('theme-toggle').onclick = function() {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            this.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        };

        function toggleMenu() { document.getElementById('sideNav').classList.toggle('active'); }
        document.addEventListener("DOMContentLoaded", type);
    </script>
</body>
</html>
